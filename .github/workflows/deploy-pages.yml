name: Build & Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deployments must not overlap, but should not be cancelled mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # This app builds with outputMode: "server", so the static client bundle
      # lands in dist/app/browser and that is what Pages serves.
      - name: Generate runtime environment config
        run: |
          cat > src/environments/environment.prod.ts <<EOF
export const environment = {
  production: true,
  supabaseUrl: '${{ secrets.SUPABASE_URL }}',
  supabaseAnonKey: '${{ secrets.SUPABASE_ANON_KEY }}',
  googleClientId: '${{ secrets.GOOGLE_CLIENT_ID }}',
};
EOF

      - name: Build Angular app
        env:
          NODE_OPTIONS: --max-old-space-size=1536
        run: npx ng build --configuration production --base-href /Enxoval-Baby/

      # outputMode: "server" emits the client shell as index.csr.html, and a
      # static host has no server to rewrite URLs. Rename the shell so Pages
      # serves it at the site root, and reuse it as 404.html so deep links
      # such as /Enxoval-Baby/l/:slug boot the app instead of GitHub's 404.
      - name: Prepare static site root
        run: |
          cd dist/app/browser
          mv index.csr.html index.html
          cp index.html 404.html
          touch .nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
